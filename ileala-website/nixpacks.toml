[phases.setup]
nixPkgs = ["nodejs_20", "pnpm"]
# Force Node.js 20.12.0+ via environment variable
# Railway will use this if Dockerfile is not available

[phases.install]
cmds = ["pnpm install --no-frozen-lockfile"]

[phases.build]
cmds = ["echo '[BUILD] Cleaning cache...' && rm -rf dist node_modules/.vite .vite client/.vite && echo '[BUILD] Cache cleaned!' && vite build && node scripts/post-build.js"]

[start]
cmd = "NODE_ENV=production tsx server/_core/index.ts"

[variables]
NODE_VERSION = "20.12.0"

